<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wayvibe</title>
  <meta name="description" content="Mapa con rutas personalizadas: la más rápida, la más turística, con sombra o con restaurantes.">
  <meta name="theme-color" content="#ffffff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map" aria-label="Map"></div>

  <div class="ui">
    <div class="searchwrap">
      <form class="search card" id="form" autocomplete="off" role="search">
        <svg class="mag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" data-i18n-placeholder="searchPlaceholder" enterkeyhint="search" role="combobox" aria-expanded="false" aria-controls="sugs">
        <button class="xbtn" id="clearQ" type="button" hidden data-i18n-label="clear">×</button>
        <label class="langbtn" title="Idioma">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3Z"/></svg>
          <span id="langCode">ES</span>
          <select id="lang" data-i18n-label="language"></select>
        </label>
      </form>
      <div class="sugs card" id="sugs" role="listbox" hidden></div>
    </div>
    <div class="where card" id="where" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg>
      <div><div class="where-l" data-i18n="youAreIn"></div><div class="where-v" id="whereText"></div></div>
    </div>
    <section class="sheet card" id="sheet" hidden></section>
  </div>

  <div class="toast card" id="toast" role="status" hidden></div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
