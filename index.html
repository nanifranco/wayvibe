<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wayvibe</title>
  <meta property="og:title" content="Wayvibe">
  <meta property="og:description" content="El mapa para estudiantes de intercambio en Corea: pide lo que se te antoja y te lleva a lugares reales que les gustan a los extranjeros, con el clima incluido.">
  <meta property="og:image" content="icon.svg">
  <meta name="description" content="El mapa para estudiantes de intercambio en Corea: pide lo que se te antoja y te lleva a lugares reales que les gustan a los extranjeros, con el clima incluido.">
  <meta name="theme-color" content="#fbf6ee">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <noscript><div class="fatal"><p>Wayvibe necesita JavaScript. Actívalo en tu navegador para ver el mapa.</p></div></noscript>
  <div id="map" role="application" aria-label="Map"></div>

  <div class="ui" id="ui">
    <div class="searchwrap">
      <form class="search card" id="form" autocomplete="off" role="search">
        <span class="brand" aria-hidden="true"><svg viewBox="0 0 512 512"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs><rect width="512" height="512" rx="120" fill="url(#bg)"/><path d="M96 168c35 120 64 176 86 176 24 0 42-104 74-104s50 104 74 104c22 0 51-56 86-176" fill="none" stroke="#fff" stroke-width="51" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <svg class="searchic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" data-i18n-placeholder="searchPlaceholder" data-i18n-label="searchPlaceholder" enterkeyhint="search" role="combobox" aria-expanded="false" aria-controls="sugs" aria-autocomplete="list">
        <button class="xbtn" id="clearQ" type="button" hidden data-i18n-label="clear">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        <label class="langbtn" data-i18n-title="language">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3Z"/></svg>
          <span id="langCode">ES</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
          <select id="lang" data-i18n-label="language"></select>
        </label>
      </form>
      <div class="sugs card" id="sugs" role="listbox" hidden></div>
    </div>
    <div class="pickbar card" id="pickbar" hidden role="status"><i class="ft-dot start" aria-hidden="true"></i><span></span><button class="link" type="button"></button></div>
    <div class="cats" id="cats" role="toolbar"></div>
    <div class="where card" id="where" hidden aria-live="polite"></div>
    <div class="hint card" id="hint" hidden>
      <span class="hint-buddy" id="hintBuddy"></span>
      <span id="hintText"></span>
      <button class="link" id="hintOk" type="button" data-i18n="gotIt"></button>
    </div>
    <section class="sheet card" id="sheet" hidden aria-live="polite">
      <button class="grab" id="grab" type="button" data-i18n-label="sheetToggle"><span></span></button>
      <div class="sheet-body" id="sheetBody"></div>
    </section>
  </div>

  <div class="navtop" id="navtop" hidden aria-live="assertive"></div>
  <button class="recenter card" id="recenter" type="button" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 20 20 12 16 4 20Z"/></svg>
    <span data-i18n="recenter"></span>
  </button>
  <div class="navbottom card" id="navbottom" hidden></div>

  <div class="offline" id="offline" role="alert" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>

  <script defer src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
