<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wayvibe</title>
  <meta name="description" content="Mapa con rutas a tu manera: la más rápida, la más turística, con sombra o con restaurantes.">
  <meta name="theme-color" content="#f4f3f8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map" aria-label="Map"></div>

  <div class="ui" id="ui">
    <div class="searchwrap">
      <form class="search glass" id="form" autocomplete="off" role="search">
        <span class="brand" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M6 10.5c2.2 7.5 4 11 5.4 11 1.5 0 2.6-6.5 4.6-6.5s3.1 6.5 4.6 6.5c1.4 0 3.2-3.5 5.4-11" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <input id="q" type="search" data-i18n-placeholder="searchPlaceholder" enterkeyhint="search" role="combobox" aria-expanded="false" aria-controls="sugs">
        <button class="xbtn" id="clearQ" type="button" hidden data-i18n-label="clear">×</button>
        <label class="langbtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3Z"/></svg>
          <span id="langCode">ES</span>
          <select id="lang" data-i18n-label="language"></select>
        </label>
      </form>
      <div class="sugs glass" id="sugs" role="listbox" hidden></div>
    </div>
    <div class="where glass" id="where" hidden>
      <span class="pulse" aria-hidden="true"></span>
      <div><div class="where-l" data-i18n="youAreIn"></div><div class="where-v" id="whereText"></div></div>
    </div>
    <section class="sheet glass" id="sheet" hidden></section>
  </div>

  <div class="navtop" id="navtop" hidden></div>
  <div class="navbottom glass" id="navbottom" hidden></div>

  <div class="toast glass" id="toast" role="status" hidden></div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
